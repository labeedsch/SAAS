<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>تأكيد حضور الاجتماع | لبيد بن ربيعة</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/theme.css?v=20261110c">
</head>
<body>
<main class="wrap" style="max-width:560px;padding-block:7vh"><div class="panel" id="box"><p class="muted">جارٍ التحميل…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=20261110c"></script>
<script>
(async () => {
  const sb = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseKey), box = document.getElementById('box');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const token = location.hash.slice(1);
  const RS = { pending: 'لم تردّ بعد', confirmed: 'أكّدتَ الحضور', declined: 'اعتذرتَ' };
  async function draw() {
    const { data: i } = await sb.rpc('get_invite', { p_token: token });
    if (!i) { box.innerHTML = '<h2>الرابط غير صالح</h2><p class="muted">تحقق من الرابط المرسل إليك أو تواصل مع منسق التقويم.</p>'; return; }
    const open = ['draft', 'scheduled'].includes(i.status);
    box.innerHTML = `<h2>${esc(i.title)}</h2><p>السلام عليكم ${esc(i.full_name)}،</p>
      <dl class="kv" style="display:grid;grid-template-columns:90px 1fr;gap:6px"><dt class="muted">التاريخ</dt><dd style="margin:0">${esc(new Date(i.meeting_date + 'T00:00:00').toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { dateStyle: 'full' }))}</dd>
      <dt class="muted">الوقت</dt><dd style="margin:0">${esc((i.start_time || '').slice(0, 5) || '—')}</dd><dt class="muted">المكان</dt><dd style="margin:0">${esc(i.location || '—')}</dd></dl>
      <p>ردّك الحالي: <b>${RS[i.rsvp]}</b></p>
      ${open ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="y">سأحضر</button><button class="btn" id="n">أعتذر</button></div><p class="err" id="e" role="alert"></p>` : '<p class="muted">انتهى باب التأكيد لهذا الاجتماع.</p>'}
      <p class="muted" style="margin-top:14px">تأكيدك مسبق فقط؛ يسجّل المنسق الحضور الفعلي أثناء الاجتماع.</p>`;
    const send = async a => {
      let reason = null; if (a === 'declined') reason = prompt('سبب الاعتذار (اختياري)') || null;
      const { data, error } = await sb.rpc('rsvp_by_token', { p_token: token, p_answer: a, p_reason: reason });
      if (error || !data) { document.getElementById('e').textContent = 'تعذّر حفظ الرد.'; return; } draw();
    };
    if (open) { document.getElementById('y').onclick = () => send('confirmed'); document.getElementById('n').onclick = () => send('declined'); }
  }
  draw();
})();
</script>
</body>
</html>
